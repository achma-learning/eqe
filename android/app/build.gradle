plugins {
    id("com.android.application")
}

android {
    namespace "online.eqe.questionbank"
    compileSdk 34

    defaultConfig {
        applicationId "online.eqe.questionbank"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // appcompat pulls in both the merged kotlin-stdlib (1.8+) and the older,
    // now-redundant kotlin-stdlib-jdk7/jdk8 artifacts transitively, which
    // duplicate classes and fail the build. Those artifacts' contents live
    // in kotlin-stdlib itself since Kotlin 1.8, so dropping them is safe.
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    // Only pulled in for AppCompatActivity + the modern OnBackPressedCallback
    // API. The app itself makes no network calls and has no other runtime
    // dependency — the whole experience is the offline HTML/CSS/JS asset.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
